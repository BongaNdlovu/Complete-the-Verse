name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test Suite Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check shared content JSON
        run: npm run content:check

      - name: Lint complexity
        run: npm run lint

      - name: Run Complete Test Suite
        run: npm test

  # No keystore secrets: fork PRs cannot run signed release.
  android-native:
    name: Native Android compile check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug and test core
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug :core:test
